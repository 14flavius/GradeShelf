version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip releases younger than a week; security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # These packages must stay on the same version.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Everything else: one pull request per week for small updates.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The Prisma SQLite adapter requires better-sqlite3 ^12.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      # The plugins bundled with eslint-config-next support ESLint up to 9.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Node types follow the supported runtime (engines.node), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
